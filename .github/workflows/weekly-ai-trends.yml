name: AI product trends (generate & deploy)

# 日次 run (daily-digest.yml) ・プラグイントレンド (weekly-plugin-trends.yml) とは疎結合な独立 workflow。
# claude-code-action は data/ai-trends/{ISSUE}.json のみを生成し（HTML は書かない）、
# scripts/render-ai-trends.mjs が決定論的に ai-trends.html / ai-trends/{issue}.html を再生成する。
# 号キーは固定した配信対象日（YYYY-MM-DD）。旧・週次時代の {YYYY-Www}.json も renderer がそのまま扱う。
# 撤退したい場合は本 workflow を disable するだけで良く、日次 run・プラグイントレンド run には一切影響しない。

on:
  schedule:
    - cron: '0 22 * * 1,3,5' # 毎週火・木・土 07:00 JST（プラグイントレンドの月・水・金と交互）
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Target issue date (YYYY-MM-DD, JST Tuesday/Thursday/Saturday; required for recovery)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # claude-code-action@v1 の GitHub トークン OIDC 交換に必須（46cabc2 の自傷を繰り返さない。GitHub Pages 用ではない）

concurrency:
  group: weekly-ai-trends
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve immutable issue date
        id: issue
        env:
          TARGET_ISSUE: ${{ inputs.issue_date }}
        run: node scripts/ai-generation-guard.mjs resolve

      - name: Check existing JSON and published article
        id: guard
        run: node scripts/ai-generation-guard.mjs mode --issue "${{ steps.issue.outputs.issue }}"

      - name: Generate theme JSON with Claude Code
        if: steps.guard.outputs.mode == 'generate'
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE: ${{ steps.issue.outputs.issue }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read prompts/weekly-ai-trends.md and follow its instructions exactly. The repository root is the current working directory. The ISSUE environment variable is already fixed to the target issue date; do not compute today's date."
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git config:*),Bash(git remote:*),Bash(git reset:*),Bash(git rebase:*)"

      - name: Validate generated or existing JSON
        if: steps.guard.outputs.mode != 'skip'
        run: node scripts/ai-generation-guard.mjs validate --issue "${{ steps.issue.outputs.issue }}"

      - name: Render ai-trends.html
        if: steps.guard.outputs.mode != 'skip'
        run: node scripts/render-ai-trends.mjs

      - name: Commit and push without replacing another issue
        if: steps.guard.outputs.mode != 'skip'
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: |
          set -euo pipefail
          # Restore action auth (existing behavior); do not grant new permissions.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/publish-ai-trends.sh

  deploy:
    needs: generate-and-deploy
    if: needs.generate-and-deploy.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-current-site.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
