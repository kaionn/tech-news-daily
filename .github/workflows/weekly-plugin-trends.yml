name: Weekly plugin trends (collect & deploy)

# 日次 run (daily-digest.yml) とは疎結合な独立 workflow。
# data/plugins/*.json を一次ソースとして GitHub stars / npm 週間 DL を収集し、
# trends.html を決定論的に生成する（LLM は使わない）。
# 撤退したい場合は本 workflow を disable するだけで良く、日次 run には一切影響しない。

on:
  schedule:
    - cron: '0 22 * * 0' # 毎週月曜 07:00 JST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # claude-code-action@v1 の GitHub トークン OIDC 交換に必須（46cabc2 の自傷を繰り返さない。GitHub Pages 用ではない）

concurrency:
  group: weekly-plugin-trends
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect trends (GitHub stars / npm downloads / discover)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/weekly-plugin-trends.mjs

      - name: Generate rising blurbs with Claude Code
        continue-on-error: true # 紹介文生成の失敗で run 全体を落とさない（renderer は description にフォールバックする）
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read prompts/weekly-trends-blurbs.md and follow its instructions exactly. The repository root is the current working directory."
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "WebFetch,Read,Write,Edit,Glob,Grep,Bash"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git config:*),Bash(git remote:*),Bash(git reset:*),Bash(git rebase:*)"

      - name: Re-render trends.html with blurbs
        run: node scripts/weekly-plugin-trends.mjs --render-only

      - name: Commit and push trends
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # claude-code-action が git 認証設定を自分のトークンで上書きしたまま終了する
          # （push 時点で失効し Invalid username or token になる）ため、GITHUB_TOKEN に張り直す
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -z "$(git status --porcelain -- data/ trends.html)" ]; then
            echo "::error::生成物に変更がない"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ trends.html
          git commit -m "$(TZ=Asia/Tokyo date '+%Y-%m-%d') の週次プラグイントレンド"
          git pull --rebase origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLEAN=$(mktemp -d)
          git archive HEAD | tar -x -C "$CLEAN"
          npx --yes wrangler@4 pages deploy "$CLEAN" --project-name=tech-news-daily --branch=main
