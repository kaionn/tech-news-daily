name: Publication safeguards
on:
  pull_request:
  push:
    branches: ['main', 'kaionn/ai-publication-guard', 'kaionn/workers-static-assets', 'kaionn/workers-preview-ci']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/tests/*.test.mjs
      - run: bash -n scripts/deploy-current-site.sh scripts/deploy-workers-preview.sh scripts/publish-ai-trends.sh
      - run: git diff --check
